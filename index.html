<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPT Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body style="background: linear-gradient(90deg, rgb(0,0,0), rgb(53,51,205));">
  <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>
  <img class="aurora-image" src="https://images.pexels.com/photos/7130560/pexels-photo-7130560.jpeg?auto=compress&cs=tinysrgb&w=1920" alt="Soft pastel gradient with pink and blue hues">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main id="menu-view" class="view active w-full px-4 py-8 sm:px-7 sm:py-12">
    <section class="mx-auto max-w-5xl">
      <div class="glass-panel rounded-[32px] px-6 py-8 text-center sm:px-12 sm:py-12" style="background:transparent;">
        <img class="mx-auto mb-6 h-32 w-32 object-contain sm:h-40 sm:w-40" src="assets/logo-menu.png" alt="IPT logo">
        <p class="mb-3 font-bold uppercase" style="color:#9decE5;font-size:32px;letter-spacing:.12rem;">Teacher reflection hub</p>
        <h1 class="font-semibold" style="color:#f4f9ff;font-weight:700;font-size:37px;">IPT Feedback</h1>
        <p class="mx-auto mt-4 max-w-xl leading-relaxed" style="color:#d6e4f7;font-size:17px;line-height:1.5;">Choose the year level you are giving feedback for.</p>
      </div>
      <section aria-label="Choose a feedback year" class="mt-6 grid gap-6 md:grid-cols-2">
        <button id="open-year6" type="button" class="menu-option rounded-[30px] p-7 text-left shadow-2xl" style="background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67;">
          <span class="relative z-10 block text-sm font-bold uppercase tracking-[.18em]" style="color:#076eaa;font-size:16px;">Bright ideas ahead</span>
          <span class="relative z-10 mt-3 block font-semibold" style="color:#073d67;font-weight:700;font-size:34px;">Year 6</span>
          <span class="relative z-10 mt-3 block max-w-sm leading-relaxed" style="color:#155b83;font-size:16px;">Share vibrant reflections on your Year 6 IPT teaching experience.</span>
          <span class="relative z-10 mt-6 inline-flex items-center gap-2 font-bold"><i data-lucide="sparkles" aria-hidden="true"></i><span style="color:#073d67;font-size:16px;">Give Year 6 feedback</span></span>
        </button>
        <button id="open-year7" type="button" class="menu-option rounded-[30px] p-7 text-left shadow-2xl" style="background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff;">
          <span class="relative z-10 block text-sm font-bold uppercase tracking-[.18em]" style="color:#9decE5;font-size:16px;">Reflect and refine</span>
          <span class="relative z-10 mt-3 block font-semibold" style="color:#f4f9ff;font-weight:700;font-size:34px;">Year 7</span>
          <span class="relative z-10 mt-3 block max-w-sm leading-relaxed" style="color:#d6e4f7;font-size:16px;">Continue to the familiar Year 7 IPT feedback experience.</span>
          <span class="relative z-10 mt-6 inline-flex items-center gap-2 font-bold"><i data-lucide="arrow-right" aria-hidden="true"></i><span style="color:#effcff;font-size:16px;">Give Year 7 feedback</span></span>
        </button>
      </section>
    </section>
  </main>

  <!-- The two form views are generated by script.js from the config at the top of that file -->
  <div id="year6-view" class="view year6-theme"></div>
  <div id="year7-view" class="view"></div>

  <script src="script.js"></script>
</body>
</html>
